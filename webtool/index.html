<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard Preprocessing Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toolbar">
        <!-- Dropdown for selecting the map -->
        <select id="map-select">
            <option value="">Select Map</option>
            <option value="Bank">Bank</option>
            <option value="Border">Border</option>
            <option value="Chalet">Chalet</option>
            <option value="Club House">Club House</option>
            <option value="Consulate">Consulate</option>
            <option value="Kafe Dostoyevsky">Kafe Dostoyevsky</option>
            <option value="Nighthaven Labs">Nighthaven Labs</option>
            <option value="Oregon">Oregon</option>
            <option value="Skyscraper">Skyscraper</option>
        </select>

        <!-- Dropdown for selecting the match type -->
        <select id="match-type-select">
            <option value="">Select Match Type</option>
            <option value="Seeding">Seeding</option>
            <option value="Playoff">Playoff</option>
            <option value="Finals">Finals</option>
        </select>

        <!-- Input fields for entering the final score -->
        <div class="score-input">
            <label for="score-team1">Final Score:</label>
            <input type="number" id="score-team1" min="0" placeholder="0">
            <span> - </span>
            <input type="number" id="score-team2" min="0" placeholder="0">
        </div>

        <button id="submit">Submit</button>
    </div>
    <div class="instructions">
        <p>Draw rectangles over the parts of the image you need to crop and submit.</p>
    </div>
    <canvas id="canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
